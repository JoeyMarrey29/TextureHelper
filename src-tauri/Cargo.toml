[package]
name = "texture-helper"
version = "0.2.3"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
gma = "1.0.0"
valve_pak = "0.1.0"
image = "0.25.10"
vtf = "0.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
regex = "1"
tempfile = "3"
walkdir = "2"
rfd = "0.15"
arboard = "3"
tauri-plugin-updater = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
